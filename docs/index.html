<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f4ef">
    <meta name="description" content="Seu guia visual de viagem para Donegal e Japão.">
    <title>Rota & Mar — seu guia de viagem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=itinerary-stacked-3">
    <script src="data.js?v=donegal-roadtrip-20261014" defer></script>
    <script src="app.js?v=editorial-4" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header" id="sidebar" aria-label="Navegação principal">
        <a class="brand" id="brand-link" href="#" aria-label="Rota e Mar, início">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>rota <span class="brand-amp">&</span> mar</span>
        </a>
        <nav id="destination-nav" class="destination-nav" aria-label="Escolha uma viagem"></nav>
        <a class="header-cta" href="#page-content"><span id="header-cta-label">SEU ROTEIRO</span><span aria-hidden="true">↘</span></a>
      </header>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span id="breadcrumb-label">SUAS VIAGENS</span><span aria-hidden="true">/</span><strong id="breadcrumb-destination"></strong></div>
          <span class="private-badge"><span aria-hidden="true">●</span> <span id="private-badge-label">SEU GUIA PARTICULAR</span></span>
        </header>

        <nav id="mobile-destination-nav" class="mobile-destination-nav" aria-label="Escolha uma viagem"></nav>

        <section id="trip-hero" class="trip-hero" aria-labelledby="trip-title">
          <div class="hero-copy">
            <span id="trip-region" class="eyebrow"></span>
            <h1 id="trip-title"></h1>
            <p id="trip-intro"></p>
            <div class="hero-meta">
              <span><span aria-hidden="true">◷</span> <span id="trip-duration"></span></span>
              <span class="meta-divider" aria-hidden="true"></span>
              <span><span aria-hidden="true">⌖</span> <span id="trip-season"></span></span>
            </div>
          </div>
          <div class="hero-search-wrap">
            <form id="guide-search" class="hero-search" role="search">
              <label class="search-field" for="guide-search-input">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="guide-search-input" type="search" autocomplete="off" placeholder="Busque um lugar ou experiência" aria-label="Busque no roteiro">
              </label>
              <button id="guide-search-submit" type="submit">Explorar <span aria-hidden="true">↗</span></button>
            </form>
            <div id="search-results" class="search-results" aria-label="Resultados da busca" aria-live="polite" hidden></div>
          </div>
          <div class="hero-stamp" aria-hidden="true"><span id="stamp-label">PRÓXIMA</span><strong id="stamp-title">grande<br>aventura</strong><i>✳</i></div>
        </section>

        <nav id="section-nav" class="section-nav" aria-label="Seções da viagem"></nav>
        <section id="page-content" class="page-content" aria-live="polite"></section>

        <footer class="page-footer"><span id="page-footer-text">FEITO COM CURIOSIDADE E UMA BOA DOSE DE CAFÉ</span><span>ROTA & MAR <span aria-hidden="true">✳</span></span></footer>
      </main>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Seções da viagem no celular"></nav>
  </body>
</html>
