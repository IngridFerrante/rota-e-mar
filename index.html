<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=./docs/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rota & Mar</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f2;
        --ink: #1b1d1a;
        --muted: #5a6159;
        --card: rgba(255,255,255,0.7);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #fffdf9 0%, var(--bg) 38%, #edf0e7 100%);
        color: var(--ink);
      }
      .card {
        background: var(--card);
        border: 1px solid rgba(27,29,26,0.08);
        border-radius: 18px;
        padding: 2rem 2.5rem;
        text-align: center;
        box-shadow: 0 18px 45px rgba(31, 31, 26, 0.08);
      }
      p {
        margin: 0;
        font-size: 1rem;
        color: var(--muted);
      }
      a {
        color: #2d5f58;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p>Redirecionando para a página do guia...</p>
      <p><a href="./docs/index.html">Clique aqui se não for redirecionado automaticamente.</a></p>
    </main>
  </body>
</html>
